name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm exec prettier --check .
      - run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm exec opennextjs-cloudflare build
      - name: Upload preview version
        id: preview
        run: |
          set -o pipefail
          pnpm exec opennextjs-cloudflare upload -- --preview-alias pr-${{ github.event.pull_request.number }} 2>&1 | tee upload.log
          echo "alias_url=$(grep -oP 'Version Preview Alias URL: \K\S+' upload.log | tail -1)" >> "$GITHUB_OUTPUT"
          echo "version_url=$(grep -oP 'Version Preview URL: \K\S+' upload.log | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Comment preview link
        if: steps.preview.outputs.alias_url != '' || steps.preview.outputs.version_url != ''
        uses: actions/github-script@v7
        env:
          ALIAS_URL: ${{ steps.preview.outputs.alias_url }}
          VERSION_URL: ${{ steps.preview.outputs.version_url }}
        with:
          script: |
            // One comment per PR, updated in place on every push
            const marker = "<!-- cloudflare-preview -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const sha = context.payload.pull_request.head.sha;
            const { ALIAS_URL, VERSION_URL } = process.env;

            const rows = [];
            if (ALIAS_URL) rows.push(`| **Latest** | ${ALIAS_URL} |`);
            if (VERSION_URL) rows.push(`| **This commit** | ${VERSION_URL} |`);
            rows.push(`| **Commit** | ${sha.slice(0, 7)} |`);

            const body = [
              marker,
              "### Cloudflare preview",
              "",
              "| | |",
              "| --- | --- |",
              ...rows,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(
              (c) => c.user?.type === "Bot" && c.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
